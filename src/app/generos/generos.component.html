<div class="page-container">
  <div class="card topo">
  <div class="header">
    <h2>Pesquisar Gênero</h2>
  </div>
  
  <div class="filtros">
    <input type="text" placeholder="Pesquisar por gênero..." class="input-form" [(ngModel)]="filtroNome">
    <button class="btn-primary" (click)="filtrarGeneros()">Buscar</button>
    <button class="btn-primary">Adicionar +</button>
  </div>
</div>

  <div class="card lista">
    <div class="linha-cabecalho">
      <span>ID</span>
      <span>Gênero</span>
      <span>Filmes Associados</span>
      <span style="text-align: right; padding-right: 20px;">Ações</span>
    </div>

    <div class="linha-item" *ngFor="let genero of generos">
      <span class="texto-bold">{{ genero.id }}</span>
      <span class="texto-bold">{{ genero.nome }}</span>
      <span class="texto-bold">{{ contarFilmes(genero.id) }}</span>
      
      <div class="acoes">
        <app-botoes-tabela rotaBase="generos" [idItem]="genero.id"></app-botoes-tabela>
      </div>
    </div>

    <div *ngIf="generos.length === 0" style="padding: 20px; text-align: center;">
      Nenhum gênero encontrado.
    </div>
  </div>
</div>
